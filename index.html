<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistemas Computacionales CESBA | Mtro. César Gabriel Terrazas</title>
    <style>
        :root {
            --primary: #f8fafc; 
            --secondary: #94a3b8;
            --accent: #0ea5e9; 
            --accent-glow: #38bdf8;
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --border-color: #334155;
            --text-main: #f1f5f9;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            overflow: hidden; 
        }

        #deck {
            display: flex;
            width: 100vw;
            height: 100vh;
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            scroll-behavior: smooth;
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        
        #deck::-webkit-scrollbar { display: none; }

        .slide {
            flex: 0 0 100vw;
            height: 100vh;
            scroll-snap-align: start;
            display: flex;
            flex-direction: column;
            justify-content: center; 
            padding: 3.5vh 5vw 9.5vh 5vw; 
            background: var(--bg-color);
            border-right: 2px solid var(--border-color);
            overflow: hidden; 
        }

        .two-columns {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 3.5vw; 
            align-items: center;
            margin-top: 1.5vh;
        }

        h1 { font-size: clamp(3.2rem, 7.5vh, 5.2rem); color: var(--primary); margin-bottom: 0.1em; line-height: 1.1; letter-spacing: -1px; }
        h1 .highlight { color: var(--accent); font-weight: 900; text-shadow: 0 0 20px rgba(14, 165, 233, 0.4); }
        h2 { font-size: clamp(2.2rem, 5.5vh, 3.5rem); color: var(--primary); margin-bottom: 0.15em; border-bottom: 3px solid var(--accent); padding-bottom: 5px; display: inline-block; }
        h3 { font-size: clamp(1.2rem, 3vh, 1.8rem); color: var(--accent); margin-bottom: 0.4em; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; }
        h4 { font-size: clamp(1.2rem, 2.8vh, 1.6rem); color: var(--accent-glow); margin: 1.2vh 0 0.8vh 0; }
        
        ul { list-style-type: none; }
        li { font-size: clamp(1rem, 2.5vh, 1.45rem); margin-bottom: 0.6em; padding-left: 1.2em; position: relative; line-height: 1.38; color: var(--secondary); }
        li::before { content: "›"; position: absolute; left: 0; color: var(--accent); font-size: 1.5rem; top: -2px; font-weight: bold; }
        p { font-size: clamp(1rem, 2.5vh, 1.45rem); line-height: 1.5; color: var(--secondary); }
        strong { color: var(--primary); }

        .image-placeholder {
            width: 100%;
            height: 46vh; 
            min-height: 240px;
            background: transparent;
            display: flex;
            align-items: center;
            justify-content: center;
            border: none;
            padding: 0;
        }

        .comparison { display: flex; gap: 2vw; margin-top: 2vh; }
        .comp-box { background: var(--card-bg); padding: 2.5vh 2vw; border-radius: 8px; flex: 1; border-left: 4px solid var(--border-color); box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
        .comp-box.after { border-left-color: var(--accent); background: rgba(14, 165, 233, 0.05); }

        #portada { text-align: center; align-items: center; justify-content: center; background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%); }
        #portada h2 { border: none; font-weight: 400; max-width: 950px; margin: 0 auto 1.2em auto; color: var(--secondary); }
        
        .bottom-controls {
            position: fixed;
            bottom: 2.5vh;
            right: 3vw;
            display: flex;
            gap: 15px;
            align-items: center;
            background: rgba(30, 41, 59, 0.95);
            padding: 8px 22px;
            border-radius: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            font-size: clamp(0.95rem, 2vh, 1.2rem);
            font-weight: 600;
            color: #94a3b8;
            z-index: 100;
            border: 1px solid var(--border-color);
        }

        /* ESTILOS DE LA DIAPOSITIVA: LABORATORIO EN VIVO */
        .live-lab-grid { display: grid; grid-template-columns: 34% 63%; gap: 3%; height: 62vh; margin-top: 1.5vh; align-items: stretch; }
        .qr-panel { background: linear-gradient(145deg, #0ea5e9, #0284c7); color: white; border-radius: 16px; padding: 2.2vh 1.8vw; display: flex; flex-direction: column; align-items: center; justify-content: space-between; text-align: center; box-shadow: 0 12px 30px rgba(14, 165, 233, 0.2); }
        .qr-card-white { background: white; padding: 1.2vh; border-radius: 12px; cursor: zoom-in; transition: transform 0.2s; box-shadow: 0 4px 15px rgba(0,0,0,0.4); }
        .qr-card-white:hover { transform: scale(1.03); }
        .qr-card-white img { height: 22vh; width: 22vh; max-width: 210px; max-height: 210px; display: block; }
        .domain-pill { background: rgba(0, 0, 0, 0.2); border: 1px solid rgba(255,255,255,0.4); color: white; padding: 0.6vh 1vw; border-radius: 20px; font-weight: 700; font-size: clamp(0.85rem, 1.9vh, 1.15rem); letter-spacing: 0.5px; }
        .counter-badge { background: rgba(255, 255, 255, 0.15); width: 100%; padding: 1.2vh; border-radius: 12px; border: 1px solid rgba(255,255,255,0.2); }
        .counter-number { font-size: clamp(2.2rem, 5.5vh, 3.8rem); font-weight: 900; color: white; line-height: 1; transition: transform 0.2s; }
        
        .sheet-panel { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 16px; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        .sheet-toolbar { background: #0f172a; padding: 1.2vh 1.5vw; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; }
        .live-dot { width: 10px; height: 10px; background: #10b981; border-radius: 50%; display: inline-block; margin-right: 8px; box-shadow: 0 0 8px #10b981; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }
        
        .sheet-table-scroll { flex: 1; overflow-y: auto; padding: 0; }
        .live-table { width: 100%; border-collapse: collapse; font-size: clamp(0.8rem, 1.7vh, 1rem); }
        .live-table th { background: #020617; color: var(--accent-glow); padding: 1.2vh 1vw; text-align: left; position: sticky; top: 0; z-index: 2; border-bottom: 1px solid var(--border-color); }
        .live-table td { padding: 1vh 1vw; border-bottom: 1px solid var(--border-color); color: var(--text-main); }
        .live-table tr:nth-child(even) { background: rgba(255,255,255,0.02); }
        .new-row-flash { animation: highlightRow 1.2s ease-out; }
        @keyframes highlightRow { from { background-color: rgba(14, 165, 233, 0.3); } to { background-color: transparent; } }

        .sheet-footer { padding: 1.5vh 1.5vw; background: #0f172a; border-top: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; gap: 15px; }
        .btn-gemini-magic { background: linear-gradient(135deg, #0ea5e9, #3b82f6); color: white; border: none; padding: 1.4vh 2vw; border-radius: 10px; font-size: clamp(0.95rem, 2.1vh, 1.25rem); font-weight: 800; cursor: pointer; display: flex; align-items: center; gap: 10px; box-shadow: 0 6px 20px rgba(14, 165, 233, 0.35); transition: all 0.25s; }
        .btn-gemini-magic:hover { transform: translateY(-2px); box-shadow: 0 10px 25px rgba(14, 165, 233, 0.5); }

        #qr-zoom-modal { display: none; position: fixed; inset: 0; background: rgba(2, 6, 23, 0.95); z-index: 999; flex-direction: column; align-items: center; justify-content: center; cursor: zoom-out; }
        #qr-zoom-modal img { width: 65vh; height: 65vh; background: white; padding: 25px; border-radius: 24px; }

        /* Terminal block */
        .terminal-block { background: #020617; color: #a5b4fc; padding: 3.5vh 3.5vw; border-radius: 12px; font-family: 'Consolas', 'Courier New', monospace; font-size: clamp(1.1rem, 2.7vh, 1.65rem); line-height: 1.6; box-shadow: 0 10px 25px rgba(0,0,0,0.4); border: 1px solid var(--border-color); }
        .terminal-block .keyword { color: #f472b6; font-weight: bold; }
        .terminal-block .string { color: #34d399; }
        .terminal-block .comment { color: #64748b; font-style: italic; }

        .arch-grid { display: flex; align-items: stretch; justify-content: space-between; gap: 1.5vw; margin-top: 2.5vh; width: 100%; }

        /* ==========================================
           DISEÑO RESPONSIVO (MÓVILES Y TABLETS)
           ========================================== */
        @media (max-width: 900px) {
            .slide { 
                justify-content: flex-start; 
                padding: 6vh 6vw 12vh 6vw; 
                overflow-y: auto; 
                height: 100vh;
            }
            .two-columns { 
                grid-template-columns: 1fr; 
                gap: 3vh; 
            }
            .comparison { flex-direction: column; }
            .arch-grid { 
                flex-direction: column; 
                gap: 2vh; 
            }
            .arch-grid > div { width: 100% !important; }
            .arch-grid > div.arrow { transform: rotate(90deg); margin: 0.5vh auto; font-size: 2rem; }
            
            .live-lab-grid { 
                grid-template-columns: 1fr; 
                height: auto; 
                display: flex; 
                flex-direction: column; 
                gap: 3vh; 
            }

                flex-direction: row; 
                flex-wrap: wrap; 
                justify-content: center; 
                padding: 3vh; 
                gap: 15px; 
            }
            .qr-card-white img { 
                height: 18vh; 
                width: 18vh; 
            }

                min-height: 50vh; 
            }
            .sheet-toolbar { flex-direction: column; gap: 10px; align-items: flex-start; }
            .sheet-footer { flex-direction: column; text-align: center; }

                width: 94vw; 
                left: 3vw; 
                right: 3vw; 
                bottom: 2vh; 
                padding: 10px; 
            }
